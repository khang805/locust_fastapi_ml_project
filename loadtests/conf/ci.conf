# Pass/fail gate for CI. SLA thresholds decide the exit code (see enforce_sla in locustfile.py)
locustfile = locustfile.py
headless = true
users = 20
spawn-rate = 5
run-time = 30s
stop-timeout = 10
exit-code-on-error = 0
max-fail-ratio = 0.01
p95-limit-ms = 2000
e2e-p95-limit-ms = 30000
html = reports/ci.html
csv = reports/ci
csv-full-history = true
json = true
