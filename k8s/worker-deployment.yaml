apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: inferqueue
  labels:
    app: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: inferqueue-sa
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do echo waiting for redis; sleep 2; done"]
      containers:
        - name: worker
          image: inferqueue:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "celery_app.celery_app", "worker", "--loglevel=info", "-c", "1"]
          envFrom:
            - configMapRef:
                name: inferqueue-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inferqueue-secrets
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
          livenessProbe:
            exec:
              command: ["celery", "-A", "celery_app.celery_app", "inspect", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc