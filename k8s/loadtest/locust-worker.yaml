apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-worker
  labels:
    app: locust-worker
spec:
  replicas: 3          # keep in sync with --expect-workers in locust-master.yaml (one Locust worker uses ~1 CPU core)
  selector:
    matchLabels:
      app: locust-worker
  template:
    metadata:
      labels:
        app: locust-worker
    spec:
      containers:
        - name: locust
          image: locustio/locust:latest
          args:
            - -f
            - /mnt/locust/locustfile.py
            - --worker
            - --master-host
            - locust-master
          volumeMounts:
            - name: locustfile
              mountPath: /mnt/locust
          resources:
            requests: {cpu: "250m", memory: "128Mi"}
            limits: {cpu: "1", memory: "512Mi"}
      volumes:
        - name: locustfile
          configMap:
            name: locustfile
